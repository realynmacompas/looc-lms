<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gradebook - Teacher Portal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <aside id="app-sidebar"></aside>
  <div id="sidebar-backdrop"></div>

  <main class="app-main">
    <div class="breadcrumb"><a href="teacher-courses.html">My Courses</a> / <a id="breadcrumbCourse" href="#">Course</a> / Gradebook</div>

    <div id="alertBox" class="alert alert-error"></div>
    <div id="loadingRow" class="loading-row">Loading gradebook...</div>

    <div id="gradebookContent" class="hidden">
      <div class="page-header" style="margin-bottom:12px;">
        <div>
          <h1 id="courseTitle">Gradebook</h1>
          <div class="subtitle" id="courseMeta"></div>
        </div>
      </div>

      <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card">
          <div class="stat-label">Class Average</div>
          <div class="stat-value" id="statClassAverage">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Students</div>
          <div class="stat-value" id="statStudentCount">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Assignments Graded</div>
          <div class="stat-value" id="statAssignmentsGraded">-</div>
        </div>
      </div>

      <div class="card" style="padding:0; overflow:hidden;">
        <div class="table-wrap">
          <table>
            <thead id="gradebookHead"></thead>
            <tbody id="gradebookBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/teacher-gradebook.js"></script>
</body>
</html>
