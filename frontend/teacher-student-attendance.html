<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Attendance - Teacher Portal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <aside id="app-sidebar"></aside>
  <div id="sidebar-backdrop"></div>

  <main class="app-main">
    <div class="breadcrumb"><a id="breadcrumbBack" href="teacher-courses.html">Gradebook</a> / Attendance</div>

    <div id="alertBox" class="alert alert-error"></div>
    <div id="loadingRow" class="loading-row">Loading attendance...</div>

    <div id="attendanceContent" class="hidden">
      <div class="card">
        <div class="page-header" style="margin-bottom:0;">
          <div>
            <h1 id="studentName">Student</h1>
            <div class="subtitle" id="studentMeta"></div>
          </div>
        </div>
        <p class="field-hint" style="margin-top:14px;">
          This is a read-only view of the student's own attendance log. Teachers can view but not
          edit a student's attendance - the student logs their own time in / time out.
        </p>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Time In</th>
                <th>Time Out</th>
                <th>Task</th>
                <th>Journal</th>
              </tr>
            </thead>
            <tbody id="attendanceBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/teacher-student-attendance.js"></script>
</body>
</html>
