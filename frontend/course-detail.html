<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Course - Student Portal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <aside id="app-sidebar"></aside>
  <div id="sidebar-backdrop"></div>

  <main class="app-main">
    <div class="breadcrumb"><a href="courses.html">My Courses</a> / <span id="breadcrumbCourse">Course</span></div>

    <div id="alertBox" class="alert alert-error"></div>
    <div id="loadingRow" class="loading-row">Loading course...</div>

    <div id="courseContent" class="hidden">
      <div class="card">
        <div class="page-header" style="margin-bottom:0;">
          <div>
            <h1 id="courseTitle">Course</h1>
            <div class="subtitle" id="courseMeta"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Materials</h2>
        <div id="materialsList"></div>
      </div>

      <div class="card">
        <h2>Assignments &amp; Grades</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Assignment</th>
                <th>Due Date</th>
                <th>Points</th>
                <th>Score</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="assignmentsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/course-detail.js"></script>
</body>
</html>
