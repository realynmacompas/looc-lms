<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - Student Portal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <aside id="app-sidebar"></aside>
  <div id="sidebar-backdrop"></div>

  <main class="app-main">
    <div class="page-header">
      <div>
        <h1 id="welcomeHeading">Welcome</h1>
        <div class="subtitle" id="welcomeSubtitle"></div>
      </div>
    </div>

    <div id="alertBox" class="alert alert-error"></div>
    <div id="loadingRow" class="loading-row">Loading your dashboard...</div>

    <div id="dashboardContent" class="hidden">
      <div class="stat-icon-row">
        <div class="stat-icon-card">
          <div class="stat-icon-top">
            <div class="stat-icon-chip chip-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            <div>
              <div class="stat-icon-value" id="statGrade">-</div>
              <div class="stat-icon-label">Overall average</div>
            </div>
          </div>
          <div class="stat-progress"><span id="statGradeBar" style="width: 0%;"></span></div>
          <div class="stat-equivalent" id="statEquivalent"></div>
        </div>

        <div class="stat-icon-card stat-icon-flex">
          <div class="stat-icon-chip chip-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
          <div>
            <div class="stat-icon-value" id="statCourses">-</div>
            <div class="stat-icon-label">Subjects</div>
          </div>
        </div>

        <div class="stat-icon-card stat-icon-flex">
          <div class="stat-icon-chip chip-warning">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div>
            <div class="stat-icon-value" id="statPending">-</div>
            <div class="stat-icon-label">Pending</div>
          </div>
        </div>

        <div class="stat-icon-card stat-icon-flex">
          <div class="stat-icon-chip chip-danger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          </div>
          <div>
            <div class="stat-icon-value" id="statOverdue">-</div>
            <div class="stat-icon-label">Overdue</div>
          </div>
        </div>
      </div>

      <div class="dashboard-columns">
        <div class="main-panel panel-card">
          <div class="panel-card-head">
            <h2>Upcoming Assignments</h2>
            <a href="#" class="view-all">View all</a>
          </div>
          <div class="panel-card-body">
            <ul class="agenda-list" id="upcomingList"></ul>
          </div>
        </div>

        <div class="side-column">
          <div class="panel-card compact">
            <h2>Announcements</h2>
            <ul class="subj-list" id="announcementsList"></ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
