<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - Student Portal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <aside id="app-sidebar"></aside>
  <div id="sidebar-backdrop"></div>

  <main class="app-main">
    <div class="page-header">
      <div>
        <h1 id="welcomeHeading">Welcome</h1>
        <div class="subtitle" id="welcomeSubtitle"></div>
      </div>
    </div>

    <div id="alertBox" class="alert alert-error"></div>
    <div id="loadingRow" class="loading-row">Loading your dashboard...</div>

    <div id="dashboardContent" class="hidden">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Enrolled Courses</div>
          <div class="stat-value" id="statCourses">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Overall Grade</div>
          <div class="stat-value" id="statGrade">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending Assignments</div>
          <div class="stat-value" id="statPending">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Overdue Assignments</div>
          <div class="stat-value" id="statOverdue">-</div>
        </div>
      </div>

      <div class="two-col">
        <div>
          <div class="card">
            <h2>My Courses</h2>
            <div id="coursesList"></div>
          </div>

          <div class="card">
            <h2>Upcoming Assignments</h2>
            <div id="upcomingList"></div>
          </div>
        </div>

        <div>
          <div class="card">
            <h2>Recent Grades</h2>
            <div id="recentGradesList"></div>
          </div>

          <div class="card">
            <h2>Attendance Summary</h2>
            <div id="attendanceSummary"></div>
            <a href="attendance.html" class="btn btn-secondary btn-sm" style="margin-top:10px;">View full attendance log</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
